name: Combo-Bot Hourly Execution

on:
  schedule:
    # Runs every hour at minute :01
    - cron: '1 * * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install ccxt pandas numpy python-telegram-bot

      - name: Run Combo-Bot
        env:
          BYBIT_TESTNET_KEY: ${{ secrets.BYBIT_TESTNET_KEY }}
          BYBIT_TESTNET_SECRET: ${{ secrets.BYBIT_TESTNET_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_single_run.py
